<div id="app"></div>
<script>
'use strict';

/* ------------------------------------------------------------------ *
 * TapeOut policy circuit — ported from lib/latch/circuit.ts
 * 7 inputs, 13 NAND gates, 0 latches, 1 output (allow, signal 19).
 * allow = !paused & keeper & whitelisted & actionOk & txCap & dailyOk & funded
 * ------------------------------------------------------------------ */
var INPUTS = [
  {name:'paused',      hint:'1 means the agent is paused'},
  {name:'keeper',      hint:'1 means the caller is the gas keeper'},
  {name:'whitelisted', hint:'1 means the target is the savings address'},
  {name:'actionOk',    hint:'1 means the call is the sweep function'},
  {name:'txCap',       hint:'1 means the amount is within the per-tx cap'},
  {name:'dailyOk',     hint:'1 means today still has room under the daily cap'},
  {name:'funded',      hint:'1 means the container covers amount plus fee'}
];

var GATES = [
  {a:0,b:0},{a:1,b:7},{a:8,b:8},{a:9,b:2},{a:10,b:10},{a:11,b:3},{a:12,b:12},
  {a:13,b:4},{a:14,b:14},{a:15,b:5},{a:16,b:16},{a:17,b:6},{a:18,b:18}
];

var N_IN = 7;
var N_OUT = 1;

function evalPolicy(bits){
  if (bits.length !== N_IN) throw new Error('Latch policy expects 7 input bits');
  var signals = bits.slice();
  for (var i = 0; i < GATES.length; i++){
    var left = signals[GATES[i].a];
    var right = signals[GATES[i].b];
    if (left === undefined || right === undefined) throw new Error('netlist wire out of range');
    signals.push(!(left && right));
  }
  return {signals: signals, allow: signals[signals.length - 1] === true};
}

function hex3(value){ return value.toString(16).padStart(6, '0'); }

function netlistHex(){
  var out = [];
  for (var i = 0; i < GATES.length; i++){
    out.push('00', hex3(GATES[i].a), hex3(GATES[i].b));
  }
  return out.join('');
}

function bitsToByte(bits){
  return bits.reduce(function(byte, bit, index){ return byte | ((bit ? 1 : 0) << index); }, 0);
}

function pad2(n){ return String(n).padStart(2, '0'); }

function gateLabel(index){
  var g = GATES[index];
  var out = N_IN + index;
  if (index === 0) return 's' + pad2(out) + ' = NAND(s' + pad2(g.a) + ', s' + pad2(g.a) + ') · NOT paused';
  if (index % 2 === 1) return 's' + pad2(out) + ' = NAND(s' + pad2(g.a) + ', s' + pad2(g.b) + ')';
  return 's' + pad2(out) + ' = NAND(s' + pad2(g.a) + ', s' + pad2(g.a) + ') · AND fold';
}

/* ------------------------------------------------------------------ *
 * Engine — ported from lib/latch/engine.ts (pure reduce() state machine)
 * ------------------------------------------------------------------ */
var PREVIEW_WALLET = '0x4E2a91c0b184A77e0c1d4e0a9C0b184A77e091c0';
var SAVINGS = '0x5a6E19c0b184A77e0c1d4e0a9C0b184A77e0A11c';
var ROGUE_TARGET = '0xBaD0000000000000000000000000000000000Bad';
var ACTIVATION_USDT = 5;
var FEE_BPS = 100;
var CHAIN_ID = 196;
var AREA_CODE = 2;
var CONFIRM_MS = 5000;
var BREAKER_PCT = 6;
var BREAKER_COOLDOWN = 10000;

function round2(value){ return Math.round(value * 100) / 100; }

function dayKey(now){ return new Date(now).toISOString().slice(0, 10); }

function sameAddress(left, right){
  return String(left).trim().toLowerCase() === String(right).trim().toLowerCase();
}

function defaultState(){
  return {
    connected: false,
    armed: false,
    running: false,
    paused: false,
    processor: '',
    cpu: '0',
    circuitId: '7',
    usdt: 1000,
    swept: 0,
    spentToday: 0,
    dayKey: '',
    perTx: 50,
    daily: 150,
    sweepAmount: 50,
    threshold: 48,
    price: 56.4,
    history: [58, 57.2, 56.8, 57.5, 56.1, 56.4],
    savings: SAVINGS,
    protocolEarned: 0,
    ticks: 0,
    logs: [{
      id: 'boot',
      at: 0,
      kind: 'system',
      title: 'Policy netlist loaded',
      detail: '13 NAND gates, 7 inputs, allow bit on signal 19. No key in the daemon.',
      bits: '',
      allow: null
    }],
    sources: [
      {venue:'OKX', seed:0.11, price:56.4},
      {venue:'Binance', seed:0.47, price:56.3},
      {venue:'CoinGecko', seed:0.83, price:56.5}
    ],
    confirmation: null,
    keeperPaused: false,
    breaker: null,
    lastBits: null,
    lastAllow: null,
    lastSignals: null,
    lastReceipt: null
  };
}

function addLog(state, entry){
  var next = {
    id: String(entry.at) + '-' + state.logs.length + '-' + state.ticks,
    at: entry.at,
    kind: entry.kind,
    title: entry.title,
    detail: entry.detail,
    bits: entry.bits || '',
    allow: entry.allow === undefined ? null : entry.allow
  };
  var logs = [next].concat(state.logs).slice(0, 40);
  return Object.assign({}, state, {logs: logs});
}

function tapeName(state){
  var id = String(state.circuitId || '').trim() || '?';
  var cpu = String(state.cpu || '').trim() || '0';
  return '#' + id + '@' + AREA_CODE + '.' + cpu;
}

function policyBits(state, proposal){
  var fee = round2((proposal.amount * feeBpsFor(state.swept)) / 10000);
  var whitelisted = sameAddress(proposal.target, state.savings);
  var actionOk = proposal.kind === 'sweep';
  var txCap = proposal.amount > 0 && proposal.amount <= state.perTx;
  var dailyOk = round2(state.spentToday + proposal.amount) <= state.daily;
  var funded = state.usdt >= round2(proposal.amount + fee);
  var bits = [state.paused, proposal.keeper, whitelisted, actionOk, txCap, dailyOk, funded];
  var reasons = [];
  if (state.paused) reasons.push('agent is paused');
  if (!proposal.keeper) reasons.push('caller is not the keeper');
  if (!whitelisted) reasons.push('target is not the savings whitelist');
  if (!actionOk) reasons.push('function is not the sweep');
  if (!txCap) reasons.push('amount is over the ' + money(state.perTx) + ' USDT per-tx cap');
  if (!dailyOk) reasons.push('daily cap of ' + money(state.daily) + ' USDT would break');
  if (!funded) reasons.push('container cannot cover the sweep plus the ' + (feeBpsFor(state.swept) / 100).toFixed(2) + '% fee');
  return {bits: bits, reasons: reasons};
}

function applyProposal(state, proposal, now){
  var key = dayKey(now);
  var rolled = state.dayKey === key ? state : Object.assign({}, state, {dayKey: key, spentToday: 0});
  var checked = policyBits(rolled, proposal);
  var bits = checked.bits;
  var reasons = checked.reasons;
  var evaluated = evalPolicy(bits);
  var bitText = bits.map(function(bit){ return bit ? '1' : '0'; }).join('');
  var fee = round2((proposal.amount * feeBpsFor(rolled.swept)) / 10000);
  var call = proposal.kind === 'sweep'
    ? 'LatchRelay.tick(' + proposal.amount.toFixed(2) + ')'
    : 'transfer(' + proposal.target + ', ' + proposal.amount.toFixed(2) + ')';

  var receipt = {
    at: now,
    allow: evaluated.allow,
    source: proposal.title,
    amount: proposal.amount,
    fee: fee,
    bits: bitText,
    call: call,
    reasons: reasons
  };

  var withEval = Object.assign({}, rolled, {
    lastBits: bits,
    lastAllow: evaluated.allow,
    lastSignals: evaluated.signals,
    lastReceipt: receipt
  });

  if (!evaluated.allow){
    return addLog(withEval, {
      at: now,
      kind: 'rejected',
      title: proposal.title + ' rejected',
      detail: reasons.join(' · ') || 'circuit returned 0',
      bits: bitText,
      allow: false
    });
  }

  var next = Object.assign({}, withEval, {
    usdt: round2(withEval.usdt - proposal.amount - fee),
    swept: round2(withEval.swept + proposal.amount),
    spentToday: round2(withEval.spentToday + proposal.amount),
    protocolEarned: round2(withEval.protocolEarned + fee)
  });

  return addLog(next, {
    at: now,
    kind: 'executed',
    title: proposal.title + ' executed',
    detail: 'Container sent ' + proposal.amount.toFixed(2) + ' USDT to savings. Fee ' + fee.toFixed(2) + ' USDT.',
    bits: bitText,
    allow: true
  });
}

function driftPrice(price, rand){
  var pulled = price + (56 - price) * 0.08 + (rand - 0.5) * 1.6;
  var shocked = rand < 0.14 ? Math.min(pulled, 39 + rand * 10) : pulled;
  return round2(Math.min(78, Math.max(32, shocked)));
}

/* A dip always prints at or below the configured threshold, never above it. */
function dipPrice(threshold){
  return Math.max(0.5, round2(Math.min(threshold - 0.5, 41)));
}

function medianPrice(sources){
  var values = sources.map(function(src){ return src.price; }).sort(function(a, b){ return a - b; });
  return round2(values[Math.floor(values.length / 2)]);
}

function consensusVotes(sources, threshold){
  return sources.filter(function(src){ return src.price <= threshold; }).length;
}

function driftSource(prev, seed, rand){
  var r = (rand + seed) % 1;
  var pulled = prev + (56 - prev) * 0.08 + (r - 0.5) * 1.3;
  var shocked = r < 0.12 ? Math.min(pulled, 40 + r * 10) : pulled;
  return round2(Math.min(78, Math.max(32, shocked)));
}

function breakerSwing(sources, prevSources){
  var maxMove = 0;
  for (var i = 0; i < sources.length; i++){
    var prev = prevSources && prevSources[i] && prevSources[i].price ? prevSources[i].price : sources[i].price;
    if (prev > 0) maxMove = Math.max(maxMove, Math.abs(sources[i].price - prev) / prev * 100);
  }
  return round2(maxMove);
}

function reduce(state, action){
  switch (action.type){
    case 'hydrate':
      return action.state;

    case 'connect':
      if (state.connected) return state;
      return addLog(Object.assign({}, state, {connected: true}), {
        at: Date.now(),
        kind: 'system',
        title: 'Preview session',
        detail: 'This wallet signs nothing. On X Layer the keeper pays gas and nothing else.'
      });

    case 'disconnect':
      return Object.assign({}, state, {connected: false, running: false});

    case 'configure': {
      var patch = action.patch;
      var next = Object.assign({}, state);
      if (patch.threshold !== undefined && Number.isFinite(patch.threshold)) next.threshold = Math.max(1, round2(patch.threshold));
      if (patch.daily !== undefined && Number.isFinite(patch.daily)) next.daily = Math.max(1, round2(patch.daily));
      if (patch.perTx !== undefined && Number.isFinite(patch.perTx)) next.perTx = Math.max(1, round2(patch.perTx));
      if (next.perTx > next.daily) next.perTx = next.daily;
      if (patch.sweepAmount !== undefined && Number.isFinite(patch.sweepAmount)) next.sweepAmount = round2(patch.sweepAmount);
      next.sweepAmount = Math.min(next.perTx, Math.max(1, next.sweepAmount));
      if (typeof patch.savings === 'string') next.savings = patch.savings.trim();
      if (typeof patch.processor === 'string') next.processor = patch.processor.trim();
      if (typeof patch.circuitId === 'string') next.circuitId = patch.circuitId.trim();
      return next;
    }

    case 'fund':
      return addLog(Object.assign({}, state, {usdt: round2(state.usdt + action.amount)}), {
        at: action.now,
        kind: 'system',
        title: 'Container funded',
        detail: '+' + action.amount.toFixed(2) + ' USDT in the preview container.'
      });

    case 'arm': {
      if (state.armed) return state;
      if (!state.connected){
        return addLog(state, {
          at: action.now,
          kind: 'system',
          title: 'Connect first',
          detail: 'Arming charges the container 5 USDT. Open a preview session so the charge has an owner.'
        });
      }
      if (state.usdt < ACTIVATION_USDT){
        return addLog(state, {
          at: action.now,
          kind: 'rejected',
          title: 'Cannot arm',
          detail: 'Activation is 5 USDT. Fund the container first.'
        });
      }
      return addLog(Object.assign({}, state, {
        armed: true,
        usdt: round2(state.usdt - ACTIVATION_USDT),
        protocolEarned: round2(state.protocolEarned + ACTIVATION_USDT)
      }), {
        at: action.now,
        kind: 'system',
        title: 'Agent armed',
        detail: '5 USDT activation booked. You can start the daemon.'
      });
    }

    case 'start': {
      if (state.running) return state;
      if (!state.connected){
        return addLog(state, {
          at: action.now,
          kind: 'system',
          title: 'Connect first',
          detail: 'The daemon will not run without a session.'
        });
      }
      if (!state.armed){
        return addLog(state, {
          at: action.now,
          kind: 'system',
          title: 'Arm the agent',
          detail: 'Activation is 5 USDT before the daemon may tick.'
        });
      }
      return addLog(Object.assign({}, state, {running: true}), {
        at: action.now,
        kind: 'system',
        title: 'Daemon started',
        detail: 'Watching OKB. A dip at or under the threshold proposes a sweep. Restart-safe.'
      });
    }

    case 'stop':
      if (!state.running) return state;
      return addLog(Object.assign({}, state, {running: false}), {
        at: action.now,
        kind: 'system',
        title: 'Daemon stopped',
        detail: 'No new sweeps until you start it again.'
      });

    case 'pause':
      if (state.paused) return state;
      return addLog(Object.assign({}, state, {paused: true}), {
        at: action.now,
        kind: 'system',
        title: 'Circuit input paused = 1',
        detail: 'The next proposal fails eval even if the price is through the floor.'
      });

    case 'resume':
      if (!state.paused) return state;
      return addLog(Object.assign({}, state, {paused: false}), {
        at: action.now,
        kind: 'system',
        title: 'Pause cleared',
        detail: 'paused input is 0 again.'
      });

    case 'dip': {
      var sources = state.sources.map(function(src){
        if (src.venue === 'CoinGecko') return {venue: src.venue, seed: src.seed, price: round2(state.threshold + 0.4)};
        return {venue: src.venue, seed: src.seed, price: dipPrice(state.threshold)};
      });
      var price = medianPrice(sources);
      var votes = consensusVotes(sources, state.threshold);
      var marked = Object.assign({}, state, {
        sources: sources,
        price: price,
        history: state.history.concat([price]).slice(-28)
      });
      if (!state.running || !state.armed){
        return addLog(marked, {
          at: action.now,
          kind: 'trigger',
          title: 'OKB marked at ' + price.toFixed(2),
          detail: state.armed ? 'Daemon is stopped, so nothing executed.' : 'Agent is not armed.'
        });
      }
      if (state.keeperPaused){
        return addLog(marked, {
          at: action.now,
          kind: 'trigger',
          title: 'Dip skipped (breaker)',
          detail: 'OKB ' + price.toFixed(2) + ' is below ' + state.threshold.toFixed(2) + ' but the volatility breaker holds the keeper paused.'
        });
      }
      return addLog(Object.assign({}, marked, {
        confirmation: {at: action.now, until: action.now + CONFIRM_MS, votes: votes, price: price}
      }), {
        at: action.now,
        kind: 'trigger',
        title: 'Dip seen — confirming ' + votes + '/3 sources',
        detail: 'CoinGecko lags at ' + sources[2].price.toFixed(2) + '. Window ' + (CONFIRM_MS / 1000) + 's before the sweep.'
      });
    }

    case 'rogue': {
      if (!state.connected || !state.armed){
        return addLog(state, {
          at: action.now,
          kind: 'system',
          title: 'Arm the agent first',
          detail: 'The rogue transfer is run through the same circuit. Connect and arm so the comparison is honest.'
        });
      }
      return applyProposal(state, {
        kind: 'transfer',
        amount: 500,
        target: ROGUE_TARGET,
        keeper: false,
        title: 'Rogue 500 USDT'
      }, action.now);
    }

    case 'confirm-check': {
      if (!state.confirmation) return state;
      if (action.now < state.confirmation.until) return state;
      var votes = consensusVotes(state.sources, state.threshold);
      if (votes >= 2 && state.confirmation.votes >= 2){
        return applyProposal(Object.assign({}, state, {confirmation: null}), {
          kind: 'sweep',
          amount: state.sweepAmount,
          target: state.savings,
          keeper: true,
          title: 'Dip sweep · consensus ' + votes + '/3'
        }, action.now);
      }
      return addLog(Object.assign({}, state, {confirmation: null}), {
        at: action.now,
        kind: 'trigger',
        title: 'Confirmation failed',
        detail: 'Sources drifted back above ' + state.threshold.toFixed(2) + ' before the window closed; no sweep.'
      });
    }

    case 'flash-crash': {
      if (!state.connected || !state.armed){
        return addLog(state, {
          at: action.now,
          kind: 'system',
          title: 'Arm the agent first',
          detail: 'The flash-crash test runs through the keeper gates. Connect and arm so the comparison is honest.'
        });
      }
      var wicked = state.sources.map(function(src){
        if (src.venue === 'CoinGecko') return {venue: src.venue, seed: src.seed, price: 30.05};
        return {venue: src.venue, seed: src.seed, price: src.price};
      });
      var votes = consensusVotes(wicked, state.threshold);
      var swing = breakerSwing(wicked, state.sources);
      var trip = swing > BREAKER_PCT;
      var wickPrice = medianPrice(wicked);
      var next = Object.assign({}, state, {
        sources: wicked,
        price: wickPrice,
        history: state.history.concat([wickPrice]).slice(-28),
        confirmation: null,
        keeperPaused: trip,
        breaker: trip ? {reason: 'single-venue swing ' + swing.toFixed(0) + '% over ' + BREAKER_PCT + '%', until: action.now + BREAKER_COOLDOWN} : null
      });
      return addLog(next, {
        at: action.now,
        kind: 'trigger',
        title: 'Flash-crash wick ignored',
        detail: 'CoinGecko wicked to 30.05 but OKX ' + state.sources[0].price.toFixed(2) + ' and Binance ' + state.sources[1].price.toFixed(2) + ' held. Consensus ' + votes + '/3 → ignored.' + (trip ? ' Volatility breaker paused the keeper for ' + (BREAKER_COOLDOWN / 1000) + 's.' : '')
      });
    }

    case 'reset': {
      var fresh = defaultState();
      fresh.connected = state.connected;
      fresh.processor = state.processor;
      fresh.cpu = state.cpu;
      fresh.circuitId = state.circuitId;
      fresh.savings = state.savings;
      return addLog(fresh, {
        at: action.now,
        kind: 'system',
        title: 'Demo reset',
        detail: 'Balances, pause, and the feed were cleared. Circuit link kept.'
      });
    }

    case 'tick': {
      if (!state.running) return state;
      var key = dayKey(action.now);
      var ticked = state.dayKey === key ? state : Object.assign({}, state, {dayKey: key, spentToday: 0});

      if (ticked.keeperPaused && ticked.breaker && action.now >= ticked.breaker.until){
        ticked = Object.assign({}, ticked, {keeperPaused: false, breaker: null});
        ticked = addLog(ticked, {
          at: action.now,
          kind: 'system',
          title: 'Volatility normalised',
          detail: 'Breaker cleared; the keeper is watching again.'
        });
      }

      var sources = ticked.sources.map(function(src){
        return {venue: src.venue, seed: src.seed, price: driftSource(src.price, src.seed, action.rand)};
      });
      var price = medianPrice(sources);
      var votes = consensusVotes(sources, ticked.threshold);
      ticked = Object.assign({}, ticked, {
        sources: sources,
        price: price,
        history: ticked.history.concat([price]).slice(-28),
        ticks: ticked.ticks + 1
      });

      if (ticked.confirmation){
        if (votes < 2){
          return addLog(Object.assign({}, ticked, {confirmation: null}), {
            at: action.now,
            kind: 'trigger',
            title: 'Confirmation aborted',
            detail: 'Only ' + votes + '/3 sources are below ' + ticked.threshold.toFixed(2) + ' now; no sweep.'
          });
        }
        return ticked;
      }

      if (ticked.keeperPaused){
        if (ticked.ticks % 3 !== 0) return ticked;
        return addLog(ticked, {
          at: action.now,
          kind: 'trigger',
          title: 'Dip skipped (breaker)',
          detail: 'OKB ' + price.toFixed(2) + ' is below ' + ticked.threshold.toFixed(2) + ' but the volatility breaker holds the keeper paused.'
        });
      }

      if (votes < 2){
        if (ticked.ticks % 3 !== 0) return ticked;
        return addLog(ticked, {
          at: action.now,
          kind: 'trigger',
          title: 'Holding',
          detail: 'Consensus ' + price.toFixed(2) + ' is above ' + ticked.threshold.toFixed(2) + ' (' + votes + '/3 sources). No proposal.'
        });
      }

      return addLog(Object.assign({}, ticked, {
        confirmation: {at: action.now, until: action.now + CONFIRM_MS, votes: votes, price: price}
      }), {
        at: action.now,
        kind: 'trigger',
        title: 'Dip seen — confirming ' + votes + '/3 sources',
        detail: 'Consensus ' + price.toFixed(2) + ' is at or under ' + ticked.threshold.toFixed(2) + '. Window ' + (CONFIRM_MS / 1000) + 's.'
      });
    }

    default:
      return state;
  }
}

/* ------------------------------------------------------------------ *
 * Store
 * ------------------------------------------------------------------ */
var KEY = 'latch.v1';
var state = defaultState();
var timer = null;
var confirmTimer = null;

function persist(){
  try {
    var stored = Object.assign({}, state);
    delete stored.lastSignals;
    localStorage.setItem(KEY, JSON.stringify(stored));
  } catch (err) { /* storage may be blocked */ }
}

function syncTicker(){
  if (state.running && !timer){
    timer = setInterval(function(){
      dispatch({type: 'tick', now: Date.now(), rand: Math.random()});
    }, 4000);
  } else if (!state.running && timer){
    clearInterval(timer);
    timer = null;
  }
}

function syncConfirmTimer(){
  if (state.confirmation && !confirmTimer){
    confirmTimer = setInterval(function(){
      dispatch({type: 'confirm-check', now: Date.now()});
    }, 1000);
  } else if (!state.confirmation && confirmTimer){
    clearInterval(confirmTimer);
    confirmTimer = null;
  }
}

function dispatch(action){
  state = reduce(state, action);
  persist();
  syncTicker();
  syncConfirmTimer();
  render();
}

function hydrate(){
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return;
    var parsed = JSON.parse(raw);
    var next = Object.assign(defaultState(), parsed);
    next.lastSignals = null;
    if (!Array.isArray(next.logs) || next.logs.length === 0) next.logs = defaultState().logs;
    if (!Array.isArray(next.sources) || next.sources.length !== 3) next.sources = defaultState().sources;
    if (next.keeperPaused && next.breaker && Date.now() >= next.breaker.until){
      next.keeperPaused = false;
      next.breaker = null;
    }
    state = next;
    if (state.running){
      state = addLog(state, {
        at: Date.now(),
        kind: 'system',
        title: 'Daemon resumed',
        detail: 'The listener came back after a reload and kept the last balances.'
      });
    }
  } catch (err){
    state = defaultState();
  }
}

/* ------------------------------------------------------------------ *
 * DOM helpers
 * ------------------------------------------------------------------ */
function h(tag, props){
  var el = document.createElement(tag);
  if (props){
    Object.keys(props).forEach(function(key){
      var value = props[key];
      if (value === null || value === undefined) return;
      if (key === 'class') el.className = value;
      else if (key === 'text') el.textContent = value;
      else if (key === 'role') el.setAttribute('role', value);
      else if (key.slice(0, 2) === 'on') el.addEventListener(key.slice(2).toLowerCase(), value);
      else el.setAttribute(key, value);
    });
  }
  for (var i = 2; i < arguments.length; i++){
    var kid = arguments[i];
    if (kid === null || kid === undefined || kid === false) continue;
    if (Array.isArray(kid)){
      kid.forEach(function(child){ if (child) el.append(child); });
    } else if (kid.nodeType){
      el.append(kid);
    } else {
      el.append(document.createTextNode(String(kid)));
    }
  }
  return el;
}

var NS = 'http://www.w3.org/2000/svg';
function icon(paths, cls){
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.8');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('class', 'ic' + (cls ? ' ' + cls : ''));
  paths.forEach(function(d){
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    svg.append(p);
  });
  return svg;
}

var P_SHIELD = ['M12 21s7-3.6 7-9V5.5L12 2.5 5 5.5V12c0 5.4 7 9 7 9z'];
var P_PLAY = ['M8 5.5l10 6.5-10 6.5z'];
var P_PAUSE = ['M9.5 5.5v13', 'M14.5 5.5v13'];

function money(value){
  return Number(value).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function clock(at){
  if (!at) return '—';
  return new Date(at).toLocaleTimeString('en-GB', {hour12: false});
}

function shortAddr(value){
  var trimmed = String(value || '').trim();
  if (trimmed.length < 12) return trimmed || '—';
  return trimmed.slice(0, 6) + '…' + trimmed.slice(-4);
}

function appConfig(){
  try {
    if (typeof window !== 'undefined' && window.APP_CONFIG) return window.APP_CONFIG;
  } catch (err) { /* ignore */ }
  return null;
}

// The relay that was actually deployed from this project, if any. Its address
// only exists after a deploy, so it is read from the injected config.
function deployedRelay(){
  var cfg = appConfig();
  var entry = cfg && cfg.contracts ? cfg.contracts.LatchRelay : null;
  if (!entry || !entry.address) return null;
  return {address: String(entry.address), chainId: cfg.chainId};
}

function explorerFor(address, chainId){
  var base = null;
  if (chainId === 56) base = 'https://bscscan.com';
  else if (chainId === 97) base = 'https://testnet.bscscan.com';
  else if (chainId === 196) base = 'https://www.oklink.com/xlayer';
  if (!base || !/^0x[0-9a-fA-F]{40}$/.test(address)) return null;
  return base + '/address/' + address;
}

function chainLabel(id){
  if (id === 56) return 'BNB Chain';
  if (id === 97) return 'BNB testnet';
  if (id === 196) return 'X Layer';
  return 'chain ' + id;
}

// One row in the body card: the relay's real address once it has been
// deployed, and a plain "not deployed yet" line until then.
function vaultRow(){
  var relay = deployedRelay();
  if (!relay) return h('p', {text: 'Vault not deployed yet'});
  var url = explorerFor(relay.address, relay.chainId);
  if (!url) return h('p', {text: 'Vault ' + shortAddr(relay.address)});
  return h('p', null,
    h('span', {text: 'Vault '}),
    h('a', {href: url, target: '_blank', rel: 'noopener noreferrer', text: shortAddr(relay.address)})
  );
}

/* ------------------------------------------------------------------ *
 * Backend — waitlist, keeper heartbeat, ops list
 * ------------------------------------------------------------------ */
function apiBase(){
  var cfg = appConfig();
  if (!cfg || !cfg.api) return null;
  return String(cfg.api).replace(/\/+$/, '');
}

var publicCache = {waiting: null, ticks: null, last: 0, heartbeat: null, error: null, at: 0, busy: false};

function since(at){
  var secs = Math.max(0, Math.round((Date.now() - at) / 1000));
  if (secs < 60) return secs + 's ago';
  if (secs < 3600) return Math.round(secs / 60) + 'm ago';
  if (secs < 86400) return Math.round(secs / 3600) + 'h ago';
  return Math.round(secs / 86400) + 'd ago';
}

// Repaints the two live lines straight from the cache. Never calls render(),
// so a slow network can never start a loop.
function paintPublic(){
  var base = apiBase();
  var waiting = document.getElementById('latch-waiting');
  if (waiting){
    if (!base) waiting.textContent = 'backend not deployed yet';
    else if (publicCache.waiting === null) waiting.textContent = 'reading…';
    else waiting.textContent = publicCache.waiting +
      (publicCache.waiting === 1 ? ' builder waiting' : ' builders waiting');
  }
  var daemon = document.getElementById('latch-daemon');
  if (daemon){
    if (!base) daemon.textContent = 'Keeper heartbeat: no backend yet.';
    else if (publicCache.error) daemon.textContent = 'Keeper heartbeat: ' + publicCache.error;
    else if (publicCache.last) daemon.textContent = 'Keeper last seen ' + since(publicCache.last) +
      ' · ' + publicCache.ticks + ' beats on record';
    else daemon.textContent = 'Keeper has not checked in yet.';
  }
  var beat = document.getElementById('latch-beat');
  if (beat) beat.textContent = beatText();
}

function beatText(){
  var base = apiBase();
  if (!base) return 'no backend yet';
  if (publicCache.error) return publicCache.error;
  if (!publicCache.last) return 'no check-in yet';
  return 'seen ' + since(publicCache.last) + ' · ' + publicCache.ticks + ' beats';
}

function loadPublic(force){
  var base = apiBase();
  if (!base || publicCache.busy) return;
  if (!force && Date.now() - publicCache.at < 20000) return;
  publicCache.busy = true;
  fetch(base + '/api/status', {headers: {Accept: 'application/json'}})
    .then(function(res){
      if (!res.ok) throw new Error('status ' + res.status);
      return res.json();
    })
    .then(function(data){
      var stats = data && data.stats ? data.stats : {};
      publicCache.waiting = Number(stats.waiting) || 0;
      publicCache.ticks = Number(stats.ticks) || 0;
      publicCache.last = Number(stats.last) || 0;
      publicCache.heartbeat = data ? data.heartbeat : null;
      publicCache.error = null;
      publicCache.at = Date.now();
      paintPublic();
    })
    .catch(function(){

  } catch (err) { /* storage blocked: stay signed out */ }
}

function saveOpsToken(token){
  ops.token = token || null;
  try {
    if (token) localStorage.setItem('latch.ops', token);
    else localStorage.removeItem('latch.ops');
  } catch (err) { /* storage blocked: token lives in memory only */ }
}

function opsSay(text, cls){

function opsLogin(){

  var input = document.querySelector('[data-k="opsPassword"]');
  var password = input ? String(input.value || '') : '';
  if (!password){ opsSay('Password first.', 'no'); return; }
  if (ops.busy) return;
  ops.busy = true;
  opsSay('Checking…', '');
  fetch(base + '/api/admin/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: password})
  })
    .then(function(res){ return res.json().then(function(data){ return {ok: res.ok, data: data}; }); })
    .then(function(res){
      ops.busy = false;
      if (!res.ok){
        opsSay(String(res.data && res.data.error ? res.data.error : 'Sign-in failed.'), 'no');
        return;
      }
      saveOpsToken(res.data.token);
      if (input) input.value = '';
      opsSay('Signed in.', 'ok');
      loadSignups();
    })
    .catch(function(){ ops.busy = false; opsSay('Network error.', 'no'); });

function loadSignups(){
  var base = apiBase();
  if (!base || !ops.token) return;
  ops.busy = true;
  fetch(base + '/api/admin/signups', {headers: {Authorization: 'Bearer ' + ops.token}})
    .then(function(res){
      if (res.status === 401){ saveOpsToken(null); throw new Error('session expired'); }
      if (!res.ok) throw new Error('status ' + res.status);
      return res.json();
    })
    .then(function(data){
      ops.signups = Array.isArray(data.signups) ? data.signups : [];
      ops.error = null;
    })
    .catch(function(err){ ops.error = String(err && err.message ? err.message : 'failed'); })
    .then(function(){ ops.busy = false; render(); });
}

    headers: {Authorization: 'Bearer ' + ops.token}
  })
    .then(function(res){
      if (res.status === 401){ saveOpsToken(null); render(); return; }
      loadSignups();

function copyText(text, labelNode){
  var done = function(){
    if (!labelNode) return;
    labelNode.textContent = 'Copied';
    setTimeout(function(){ if (labelNode) labelNode.textContent = 'Copy'; }, 1200);
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
      return;
    }
  } catch (err) { /* fall through */ }
  fallbackCopy(text, done);
}

function fallbackCopy(text, done){
  try {
    var area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.append(area);
    area.select();
    document.execCommand('copy');
    area.remove();
    done();
  } catch (err) { /* clipboard unavailable */ }
}

var SEL = {
  status: '0x200d2ed2', preview: '0xc317c377', circuitAllows: '0xb905eac7',

};
var TOPIC_SWEEP = '0x3da7689974f13093359934c7f011f3c8cbe727f25892e588f8eef693942efa4c';
var ERRORS = {
  '0xf512b278': 'NotKeeper', '0x8db2750a': 'NotArmed', '0x9e87fac8': 'Paused',
  '0x342fa66d': 'OverCap', '0xe1a8ca9e': 'Underfunded', '0xb45c8aab': 'CircuitDenied',

  '0xbc57f770': 'UnderfundedActivation', '0x90b8ec18': 'TransferFailed', '0xb5dfd9e5': 'Reentered'
};
var CHAIN_META = {
  196: {hex: '0xc4', name: 'X Layer Mainnet', rpc: 'https://rpc.xlayer.tech', scan: 'https://www.oklink.com/xlayer'},

function liveRelay(){

/* ---- JSON-RPC + ABI, by hand: one contract, a dozen calls ---- */
function rpcCall(method, params){
  var w = wallet();
  if (walletOnChain() && w && method !== 'eth_getLogs') return w.request({method: method, params: params});
  return fetch(liveRpcUrl(), {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({jsonrpc: '2.0', id: Date.now(), method: method, params: params})
  }).then(function(res){ return res.json(); }).then(function(body){
    if (body.error){
      var e = new Error(body.error.message || 'rpc error');
      e.data = body.error.data;
      throw e;
    }
    return body.result;
  });
}
function word(hex){ return String(hex).replace(/^0x/, '').padStart(64, '0'); }
function encUint(n){ return word(BigInt(n).toString(16)); }
function words(hex){
  var s = String(hex || '').replace(/^0x/, '');
  var out = [];
  for (var i = 0; i + 64 <= s.length; i += 64) out.push(s.slice(i, i + 64));
  return out;
}
function wUint(w){ return BigInt('0x' + w); }
function wAddr(w){ return '0x' + w.slice(24); }
function wBool(w){ return BigInt('0x' + w) !== 0n; }
function ethCall(data, from){
  var tx = {to: liveRelay(), data: data};
  if (from) tx.from = from;
  return rpcCall('eth_call', [tx, 'latest']);
}
function revertName(err){
  var data = err && (err.data && (err.data.data || err.data)) || '';
  if (typeof data !== 'string'){
    var m = String((err && err.message) || '').match(/0x[0-9a-fA-F]{8}/);
    data = m ? m[0] : '';
  }
  var sel = String(data).slice(0, 10).toLowerCase();
  if (ERRORS[sel]){
    if (ERRORS[sel] === 'CircuitDenied' && data.length >= 74) return 'CircuitDenied(0x' + parseInt(data.slice(-2), 16).toString(16).padStart(2, '0') + ')';
    return ERRORS[sel];
  }
  return (err && err.message) ? String(err.message).slice(0, 120) : 'reverted';
}
function tokens(raw, unit){
  if (raw === null || raw === undefined || !unit) return '—';
  var whole = Number(raw) / Number(unit);
  return whole.toLocaleString(undefined, {maximumFractionDigits: 2});
}

function loadLive(force){
  if (!isLive() || live.busy) return;
  if (!force && Date.now() - live.at < 15000) return;
  live.busy = true;
  var d = {};
  Promise.all([
    ethCall(SEL.status), ethCall(SEL.unit), ethCall(SEL.feeBpsNow), ethCall(SEL.volumeSwept),
    ethCall(SEL.owner), ethCall(SEL.processor), ethCall(SEL.circuitId), ethCall(SEL.container),
    ethCall(SEL.activationFee),
    ethCall(SEL.circuitAllows + encUint(0x7e)), ethCall(SEL.circuitAllows + encUint(0x7f))
  ]).then(function(r){
    var s = words(r[0]);
    d.token = wAddr(s[0]); d.armed = wBool(s[1]); d.paused = wBool(s[2]);
    d.balance = wUint(s[3]); d.perTxCap = wUint(s[4]); d.dailyCap = wUint(s[5]);
    d.spentToday = wUint(s[6]); d.keeper = wAddr(s[7]); d.savings = wAddr(s[8]); d.treasury = wAddr(s[9]);
    d.unit = wUint(words(r[1])[0]); d.feeBps = Number(wUint(words(r[2])[0]));
    d.volumeSwept = wUint(words(r[3])[0]); d.owner = wAddr(words(r[4])[0]);
    d.processor = wAddr(words(r[5])[0]); d.circuitId = wUint(words(r[6])[0]);
    d.container = wAddr(words(r[7])[0]); d.activationFee = wUint(words(r[8])[0]);
    d.allows7e = wBool(words(r[9])[0]); d.allows7f = wBool(words(r[10])[0]);
    d.sweep = d.perTxCap;
    // The verdict tick would reach right now, asked as the keeper.
    return ethCall(SEL.preview + encUint(d.sweep), d.keeper);
  }).then(function(p){
    var w = words(p);
    d.previewBits = Number(wUint(w[0]));
    d.previewAllow = wBool(w[1]);
    return rpcCall('eth_blockNumber', []).then(function(bn){
      var to = BigInt(bn);
      var from = to > 9000n ? to - 9000n : 0n;
      return rpcCall('eth_getLogs', [{address: liveRelay(), topics: [TOPIC_SWEEP], fromBlock: '0x' + from.toString(16), toBlock: '0x' + to.toString(16)}]);
    }).then(function(logs){
      d.sweeps = (logs || []).slice(-6).reverse().map(function(l){
        var w2 = words(l.data);
        return {hash: l.transactionHash, amount: wUint(w2[0]), fee: wUint(w2[1])};
      });
    }).catch(function(){ d.sweeps = null; });
  }).then(function(){
    live.data = d;
    live.error = null;
  }).catch(function(err){
    live.error = 'Could not read the relay: ' + ((err && err.message) || err);
  }).then(function(){
    live.at = Date.now();
    live.busy = false;
    render();
  });
}

function connectWallet(){
  var w = wallet();
  if (!w){
    live.walletError = 'No wallet found. Install OKX Wallet or MetaMask, then reload.';
    render();
    return;
  }
  live.walletError = null;
  w.request({method: 'eth_requestAccounts'}).then(function(accts){
    live.account = accts && accts[0] ? accts[0] : null;
    return w.request({method: 'eth_chainId'});
  }).then(function(id){
    live.walletChain = Number(id);
    if (live.walletChain !== liveChainId()) return switchChain();
  }).catch(function(err){
    live.walletError = (err && err.message) || String(err);
  }).then(function(){ render(); loadLive(true); });
}
function switchChain(){
  var w = wallet();
  var meta = liveMeta();
  return w.request({method: 'wallet_switchEthereumChain', params: [{chainId: meta.hex}]}).catch(function(err){
    if (err && (err.code === 4902 || /Unrecognized chain/i.test(err.message || ''))){
      return w.request({method: 'wallet_addEthereumChain', params: [{
        chainId: meta.hex, chainName: meta.name,
        nativeCurrency: {name: 'OKB', symbol: 'OKB', decimals: 18},
        rpcUrls: [meta.rpc], blockExplorerUrls: [meta.scan]
      }]});
    }
    throw err;
  }).then(function(){
    return w.request({method: 'eth_chainId'});
  }).then(function(id){ live.walletChain = Number(id); });
}
(function watchWallet(){
  var w = wallet();
  if (!w || !w.on) return;
  w.on('accountsChanged', function(a){ live.account = a && a[0] ? a[0] : null; render(); });
  w.on('chainChanged', function(id){ live.walletChain = Number(id); render(); loadLive(true); });
})();

function sendRelay(label, data, opts){
  opts = opts || {};
  var w = wallet();
  if (!walletOnChain() || !w) return;
  var tx = {from: live.account, to: liveRelay(), data: data};
  // A fixed gas limit lets a transaction we expect to revert reach the chain,
  // so the rejection is recorded on X Layer rather than only in the wallet.
  if (opts.forceGas) tx.gas = '0x493e0';
  var entry = {label: label, hash: null, state: 'signing', note: ''};
  live.txs.unshift(entry);
  render();
  w.request({method: 'eth_sendTransaction', params: [tx]}).then(function(hash){
    entry.hash = hash;
    entry.state = 'pending';
    render();
    return waitReceipt(hash);
  }).then(function(rcpt){
    entry.state = rcpt && rcpt.status === '0x1' ? 'confirmed' : 'reverted on chain';
  }).catch(function(err){
    entry.state = 'not sent';
    entry.note = revertName(err);
  }).then(function(){ render(); loadLive(true); });
}
function waitReceipt(hash){
  return new Promise(function(resolve, reject){
    var tries = 0;
    (function poll(){
      rpcCall('eth_getTransactionReceipt', [hash]).then(function(r){
        if (r) return resolve(r);
        if (++tries > 60) return reject(new Error('no receipt after 2 minutes'));
        setTimeout(poll, 2000);
      }).catch(reject);
    })();
  });
}

/* ---- read-only checks anyone can run ---- */
function dryRunRogue(){
  var d = live.data;
  if (!d) return;
  var amount = 500n * d.unit;
  live.dryRun = {state: 'asking'};
  render();
  // eth_call of tick() as the keeper: the chain runs the real checks and
  // returns the revert reason, without anyone paying gas.
  ethCall(SEL.tick + encUint(amount), d.keeper).then(function(){
    live.dryRun = {state: 'done', text: 'tick(500 USDT) would SUCCEED — check the caps!', ok: false};
  }).catch(function(err){
    live.dryRun = {state: 'done', text: 'tick(500 USDT) rejected on chain: ' + revertName(err), ok: true};
  }).then(render);
}
function probeCircuit(){
  var b = Math.max(0, Math.min(127, Number(live.probeByte) || 0));
  live.probe = {state: 'asking', byte: b};
  render();
  ethCall(SEL.circuitAllows + encUint(b)).then(function(r){
    live.probe = {state: 'done', byte: b, allow: wBool(words(r)[0])};
  }).catch(function(err){
    live.probe = {state: 'done', byte: b, error: revertName(err)};
  }).then(render);
}

/* ---- view ---- */
function liveRole(){
  var d = live.data;
  if (!d || !live.account) return null;
  if (sameAddress(live.account, d.owner)) return 'owner';
  if (sameAddress(live.account, d.keeper)) return 'keeper';
  return 'viewer';
}
function link(text, href){
  return h('a', {href: href, target: '_blank', rel: 'noopener noreferrer', text: text});
}
function liveFact(label, value){
  return h('div', {class: 'fact'}, h('dt', {text: label}), h('dd', {class: 'mono'}, value));
}

function liveCard(){
  var d = live.data;
  var meta = liveMeta();
  var bar = h('div', {class: 'card-bar'},
    h('h2', {class: 'h2', text: 'Live relay · ' + meta.name}),
    h('span', {class: 'badge mono ' + (d && d.armed && !d.paused ? 'ok' : 'no'),
      text: !d ? 'READING' : d.paused ? 'PAUSED' : d.armed ? 'ARMED' : 'NOT ARMED'})
  );
  if (!d){
    return h('div', {class: 'card pad0'}, bar,
      h('div', {class: 'body'}, h('p', {class: 'tiny', text: live.error || 'Reading ' + shortAddr(liveRelay()) + ' on chain…'})));
  }
  var u = d.unit;
  var role = liveRole();
  var actions = [];
  if (!live.account){
    actions.push(btn('Connect wallet', connectWallet, {amber: true, small: true}));
  } else if (!walletOnChain()){
    actions.push(btn('Switch to ' + meta.name, function(){ switchChain().then(render, function(e){ live.walletError = e.message; render(); }); }, {amber: true, small: true}));
  }
  if (role === 'owner' && walletOnChain()){
    if (!d.armed) actions.push(btn('Arm on chain · ' + tokens(d.activationFee, u) + ' USDT', function(){ sendRelay('arm()', SEL.arm); }, {amber: true, small: true}));
    actions.push(btn(d.paused ? 'Resume' : 'Pause', function(){
      sendRelay(d.paused ? 'setPaused(false)' : 'setPaused(true)', SEL.setPaused + encUint(d.paused ? 0 : 1));
    }, {small: true}));
  }
  if (role === 'keeper' && walletOnChain()){
    actions.push(btn('Sweep ' + tokens(d.sweep, u) + ' USDT on chain', function(){ sendRelay('tick(' + tokens(d.sweep, u) + ')', SEL.tick + encUint(d.sweep)); }, {amber: true, small: true}));
    actions.push(btn('Send rogue 500 (must revert)', function(){ sendRelay('tick(500) — rogue', SEL.tick + encUint(500n * u), {forceGas: true}); }, {small: true}));
  }
  actions.push(btn('Dry-run rogue 500', dryRunRogue, {small: true, ghost: true}));
  actions.push(btn('Refresh', function(){ loadLive(true); }, {small: true, ghost: true}));

  var bitsStr = d.previewBits.toString(2).padStart(7, '0').split('').reverse().join('');
  var facts = h('dl', {class: 'facts'},
    liveFact('Relay', link(shortAddr(liveRelay()), scanAddr(liveRelay()))),
    liveFact('Container', link(shortAddr(d.container), scanAddr(d.container))),
    liveFact('Container USDT', h('span', {text: tokens(d.balance, u)})),
    liveFact('Sent to savings', h('span', {text: tokens(d.volumeSwept, u) + ' total · ' + tokens(d.spentToday, u) + ' / ' + tokens(d.dailyCap, u) + ' today'})),
    liveFact('Caps', h('span', {text: tokens(d.perTxCap, u) + ' per tx · ' + tokens(d.dailyCap, u) + ' daily · fee ' + (d.feeBps / 100).toFixed(2) + '%'})),
    liveFact('Next sweep verdict', h('span', {class: d.previewAllow ? 'ok' : 'no',
      text: (d.previewAllow ? 'ALLOW' : 'DENY') + ' · byte 0x' + d.previewBits.toString(16).padStart(2, '0') + ' · bits ' + bitsStr})),
    liveFact('TapeOut circuit', h('span', {}, link(shortAddr(d.processor), scanAddr(d.processor)),
      h('span', {text: ' #' + d.circuitId.toString() + ' · eval(0x7e)=' + (d.allows7e ? 'allow' : 'deny') + ', eval(0x7f)=' + (d.allows7f ? 'allow' : 'deny')}))),
    liveFact('Keeper', link(shortAddr(d.keeper), scanAddr(d.keeper))),
    liveFact('Savings', link(shortAddr(d.savings), scanAddr(d.savings))),
    liveFact('Owner', link(shortAddr(d.owner), scanAddr(d.owner))),
    liveFact('You', h('span', {text: live.account ? shortAddr(live.account) + (role ? ' · ' + role : '') : 'not connected'}))
  );

  var circuitOk = d.allows7e && !d.allows7f;
  var extra = [];
  if (!circuitOk) extra.push(h('p', {class: 'tiny no', text: 'Circuit check failed: the taped-out circuit should allow 0x7e and deny 0x7f. Check the processor and circuit ID before funding.'}));
  if (live.walletError) extra.push(h('p', {class: 'tiny no', text: live.walletError}));
  if (live.error) extra.push(h('p', {class: 'tiny no', text: live.error}));
  if (live.dryRun) extra.push(h('p', {class: 'tiny ' + (live.dryRun.ok ? 'ok' : 'no'), text: live.dryRun.state === 'asking' ? 'Asking the chain…' : live.dryRun.text}));
  live.txs.slice(0, 5).forEach(function(t){
    extra.push(h('p', {class: 'tiny mono'},
      h('span', {text: t.label + ' · ' + t.state + (t.note ? ' · ' + t.note : '') + ' '}),
      t.hash ? link(shortAddr(t.hash), scanTx(t.hash)) : null));
  });
  if (d.sweeps && d.sweeps.length){
    extra.push(h('p', {class: 'label', text: 'Recent sweeps on chain'}));
    d.sweeps.forEach(function(s){
      extra.push(h('p', {class: 'tiny mono'},
        h('span', {text: tokens(s.amount, u) + ' USDT + ' + tokens(s.fee, u) + ' fee · '}),
        link(shortAddr(s.hash), scanTx(s.hash))));
    });
  }

  return h('div', {class: 'card pad0'}, bar,
    h('div', {class: 'body'}, facts, extra),
    h('div', {class: 'card-foot'},
      h('div', {class: 'row', style: 'flex-wrap:wrap;gap:.45rem'}, actions),
      h('span', {class: 'tiny', text: 'Read from X Layer ' + (live.at ? since(live.at) : '') + '. Owner and keeper buttons appear when the connected wallet holds that role.'})
    )
  );
}

function probeCard(){
  if (!isLive()) return null;
  var p = live.probe;
  var result = !p ? 'Pick a byte (0–127) and ask the deployed processor.'
    : p.state === 'asking' ? 'Asking the chain…'
    : p.error ? 'eval failed: ' + p.error
    : 'Processor says ' + (p.allow ? 'ALLOW' : 'DENY') + ' for 0x' + p.byte.toString(16).padStart(2, '0') +
      ' (expected ' + (p.byte === 0x7e ? 'ALLOW' : 'DENY') + ')';
  return h('div', {class: 'card'},
    h('p', {class: 'label', text: 'Ask the taped-out circuit on chain'}),
    h('div', {class: 'row', style: 'margin-top:.5rem'},
      h('label', {class: 'field'},
        h('span', {text: 'Policy byte'}),
        h('input', {type: 'number', min: '0', max: '127', 'data-k': 'probe-byte', value: String(live.probeByte),
          oninput: function(e){ live.probeByte = e.target.value; }})
      ),
      btn('Ask chain', probeCircuit, {small: true, amber: true})
    ),
    h('p', {class: 'tiny ' + (p && p.state === 'done' && !p.error && (p.allow === (p.byte === 0x7e)) ? 'ok' : ''), style: 'margin-top:.5rem', text: result})
  );
}

/* ------------------------------------------------------------------ *
 * Render
 * ------------------------------------------------------------------ */
function render(){
  var app = document.getElementById('app');
  var active = document.activeElement;
  var key = active && active.getAttribute ? active.getAttribute('data-k') : null;
  var held = null;
  var sel = null;
  if (key && active.value !== undefined){
    held = active.value;
    if (typeof active.selectionStart === 'number') sel = [active.selectionStart, active.selectionEnd];
  }

  app.replaceChildren();
  app.append(header());
  var main = h('main');
  if (tab === 'Circuit') main.append(circuitView());
  else if (tab === 'Brief') main.append(briefView());
  else main.append(operateView());
  app.append(main);
  app.append(h('footer', {},
    h('p', {class: 'foot',
      text: isLive()
        ? 'The Live relay card reads the deployed LatchRelay on ' + liveMeta().name + ' and sends real transactions from your wallet. The practice simulator below it runs in this page and never signs.'
        : 'Simulator build. The netlist evaluator and the policy state machine run in this page — the balances and receipts here are simulated, and nothing on this page signs or broadcasts. LatchRelay is real: deploy it from this project and the Caps, fee and arming numbers above are the ones the contract enforces.'})
  ));
  if (isLive()) loadLive(false);
  if (statusOpen){
    app.append(statusView());
    loadPublic(false);
  }

  if (tab === 'Brief'){
    paintPublic();
    loadPublic(false);
  }

  if (key){
    var field = document.querySelector('[data-k="' + key + '"]');
    if (field){
      if (held !== null) field.value = held;
      field.focus();
      if (sel && field.setSelectionRange){
        try { field.setSelectionRange(sel[0], sel[1]); } catch (err) { /* number inputs */ }
      }
    }
  }
}

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */
hydrate();
loadOpsToken();
render();
syncTicker();
if (isLive()) setInterval(function(){ loadLive(false); }, 20000);
</script>
