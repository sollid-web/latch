<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latch — stack OKB on autopilot, without trusting a bot</title>
<meta name="description" content="Automatic OKB buying on X Layer. Buy the dip or DCA from a vault only you control; on-chain rules and a TapeOut circuit stop the bot from misbehaving.">
<style>
:root{
  --bg:#0a0b09;--bg-deep:#060706;--surface:#111310;--raised:#191c17;
  --fg:#f4f2ec;--muted:#a09d92;--line:#242821;--line-strong:#33382d;
  --amber:#f2a94e;--amber-hi:#ffc477;--ink:#140f06;--good:#8fd18b;--bad:#e06a4e;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg-deep);scroll-behavior:smooth}
body{background:radial-gradient(1200px 600px at 70% -10%,rgba(242,169,78,.10),transparent 60%),var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--amber)}a:hover{color:var(--amber-hi)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tiny{font-size:.75rem;color:var(--muted)}
.row{display:flex;align-items:center}.gap{gap:.6rem}.wrap{flex-wrap:wrap}.between{justify-content:space-between;gap:.6rem}.end{justify-content:flex-end}.grow{flex:1}
main{max-width:980px;margin:0 auto;padding:0 1.1rem 3rem}
.hdr{position:sticky;top:0;z-index:20;background:rgba(10,11,9,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:980px;margin:0 auto;padding:.7rem 1.1rem;display:flex;align-items:center;gap:.7rem}
.wordmark{font-family:var(--mono);font-weight:700;letter-spacing:.3em;color:var(--amber);text-decoration:none;text-shadow:0 0 22px rgba(242,169,78,.45)}
.net{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.1rem .55rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.6rem;padding:0 1.05rem;border-radius:.6rem;border:1px solid var(--line-strong);background:var(--raised);font-weight:600;font-size:.92rem;text-decoration:none;color:var(--fg);transition:transform .12s,border-color .12s}
.btn:hover{border-color:var(--amber)}.btn:active{transform:translateY(1px)}
.btn.amber{background:linear-gradient(180deg,var(--amber-hi),var(--amber));color:var(--ink);border-color:transparent;box-shadow:0 10px 30px -12px rgba(242,169,78,.7)}
.btn.ghost{background:transparent}.btn.sm{min-height:2.2rem;padding:0 .8rem;font-size:.84rem}.btn.lg{min-height:3rem;padding:0 1.4rem;font-size:1rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.hero{padding:3.2rem 0 2rem}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
h1{font-size:clamp(2rem,5.5vw,3.3rem);line-height:1.08;margin:.6rem 0 1rem;letter-spacing:-.02em}
.hl{color:var(--amber)}
.lead{color:#d9d6cc;font-size:1.06rem;max-width:44rem;margin-bottom:1.4rem}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1.8rem}
.strip>div,.stats>div{background:var(--surface);border:1px solid var(--line);border-radius:.7rem;padding:.7rem .85rem;display:flex;flex-direction:column;gap:.15rem}
.k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.v{font-size:1.15rem}
h2{font-size:1.35rem;margin:2rem 0 .8rem}h3{font-size:1.02rem;line-height:1.35}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:1.1rem 1.2rem;margin:.8rem 0}
.card p{color:#d9d6cc;margin-top:.45rem}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}.cols .card{margin:0}
#how{margin-top:2rem}
.vault .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:.9rem 0}
.next{font-size:.95rem;color:var(--fg)!important}
.pill{font-size:.75rem;padding:.2rem .6rem;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.pill.yes{color:var(--good);border-color:rgba(143,209,139,.4)}.pill.no{color:var(--bad);border-color:rgba(224,106,78,.4)}
details{margin-top:.7rem;border-top:1px solid var(--line);padding-top:.6rem}
summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.checks{list-style:none;margin:.6rem 0;display:grid;gap:.3rem}
.checks li{display:flex;gap:.55rem;align-items:center;font-size:.92rem}
.checks li span{width:1.3rem;height:1.3rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;flex:none}
.checks li.yes span{background:rgba(143,209,139,.15);color:var(--good)}.checks li.no span{background:rgba(224,106,78,.15);color:var(--bad)}
.checks.static{grid-template-columns:1fr 1fr}
.chip{font-size:.85rem;margin-top:.4rem}.chip.yes b{color:var(--good)}.chip.no b{color:var(--bad)}
.yes{color:var(--good)}.no{color:var(--bad)}
.hist{width:100%;border-collapse:collapse;margin-top:.5rem;font-size:.85rem}.hist th,.hist td{text-align:left;padding:.35rem .3rem;border-bottom:1px solid var(--line)}.hist th{color:var(--muted);font-weight:500}
.actions{margin-top:.9rem}
.err{background:rgba(224,106,78,.1);border:1px solid rgba(224,106,78,.35);color:#f2b3a4;border-radius:.6rem;padding:.6rem .8rem;margin:.6rem 0;font-size:.9rem}
.note{background:rgba(242,169,78,.08);border:1px solid rgba(242,169,78,.3);border-radius:.6rem;padding:.6rem .8rem;margin:.6rem 0}
.empty{text-align:center;padding:2rem}.empty .btn{margin-top:.8rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;z-index:50;overflow:auto}
.sheet{background:var(--surface);border:1px solid var(--line-strong);border-radius:1rem;width:100%;max-width:560px;padding:1.2rem 1.3rem}
.sheet h2{margin:0}.x{font-size:1.6rem;color:var(--muted);width:2.4rem;height:2.4rem}
.steps{list-style:none;display:flex;gap:.4rem;margin:.9rem 0 1.1rem;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.steps li{padding:.2rem .55rem;border-radius:999px;border:1px solid var(--line)}.steps li.on{color:var(--ink);background:var(--amber);border-color:var(--amber)}.steps li.done{color:var(--good)}
.choices{display:grid;gap:.6rem;margin-bottom:1rem}
.choice{text-align:left;border:1px solid var(--line-strong);border-radius:.8rem;padding:.9rem 1rem;background:var(--raised);display:flex;flex-direction:column;gap:.25rem}
.choice span{color:var(--muted);font-size:.9rem}.choice.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.form{display:grid;gap:.85rem;margin-bottom:1rem}
.form label{display:grid;gap:.3rem;font-size:.9rem}
.form small{color:var(--muted);font-size:.78rem}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line-strong);border-radius:.55rem;padding:.6rem .7rem;width:100%}
input:focus,select:focus{outline:2px solid var(--amber);outline-offset:1px}
.chk{display:flex!important;align-items:center;gap:.5rem}.chk input{width:auto}
.review .big,.big{font-size:1.05rem;margin:.3rem 0 .8rem}
.facts{margin:.4rem 0 1rem 1.1rem;color:#d9d6cc;display:grid;gap:.3rem;font-size:.92rem}
.faq details p{margin-top:.4rem}
footer{max-width:980px;margin:0 auto;padding:1.5rem 1.1rem 2.5rem;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line)}
@media (max-width:720px){.strip,.cols,.vault .stats,.checks.static{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.hero{padding-top:2rem}}
@media (max-width:420px){.strip,.vault .stats{grid-template-columns:1fr}}
</style>
</head>
