<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latch: buy OKB on dips, take profit on rises, sized by an on-chain chip</title>
<meta name="description" content="Automatic OKB buying and profit-taking on X Layer from a vault only you control. A 101-gate TapeOut circuit on chain decides the size of every trade.">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#0c1714">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --substrate:#0c1714;--mask:#11211d;--mask-2:#172c26;--line:#23403a;--line-2:#2f5249;
  --paper:#e9f1ec;--muted:#93a89f;--gold:#e3b04b;--gold-hi:#f2c86d;--gold-ink:#1b1405;
  --pass:#79e0be;--deny:#ff8a70;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-s:6px;--r-m:10px;--r-l:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--substrate);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{color:var(--paper);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  background:
    linear-gradient(transparent 31px,rgba(121,224,190,.035) 32px) 0 0/32px 32px,
    linear-gradient(90deg,transparent 31px,rgba(121,224,190,.035) 32px) 0 0/32px 32px,
    var(--substrate)}
a{color:var(--gold-hi);text-underline-offset:3px}a:hover{color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.ok{color:var(--pass)}.bad{color:var(--deny)}
.row{display:flex;align-items:center}.between{justify-content:space-between;gap:12px}.end{justify-content:flex-end}.gap{gap:10px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
h1{font-weight:600;font-size:clamp(2.1rem,4.6vw,3.6rem);line-height:1.05;letter-spacing:-.025em;max-width:13ch}
h2{font-weight:600;font-size:1.45rem;letter-spacing:-.01em;line-height:1.2}
h3{font-weight:600;font-size:1.08rem}
p{max-width:68ch}
.hdr{position:sticky;top:0;z-index:30;background:rgba(12,23,20,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:24px;height:64px}
.mark{display:flex;align-items:center;gap:10px;color:var(--gold);text-decoration:none;font-weight:700;font-size:1.15rem;letter-spacing:-.01em}
.mark span{color:var(--paper)}
.nav{display:flex;gap:22px;margin-left:auto}.nav a{color:var(--muted);text-decoration:none;font-size:.93rem}.nav a:hover{color:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:var(--r-s);font-weight:600;font-size:.95rem;text-decoration:none;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s}
.btn.primary{background:var(--gold);color:var(--gold-ink)}.btn.primary:hover{background:var(--gold-hi);color:var(--gold-ink)}
.btn.quiet{border-color:var(--line-2);color:var(--paper);background:rgba(23,44,38,.6)}.btn.quiet:hover{border-color:var(--gold);color:var(--paper)}
.btn.danger{background:var(--deny);color:#230a04}
.btn.lg{height:50px;padding:0 24px;font-size:1rem}.btn.sm{height:36px;padding:0 13px;font-size:.87rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hero{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.15fr);gap:48px;align-items:center;padding-top:72px;padding-bottom:64px}
.lead{font-size:1.1rem;color:#c9d8d1;margin:22px 0 30px;max-width:52ch}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(4,auto);gap:28px;margin-top:40px;justify-content:start}
.facts dt{font-size:.8rem;color:var(--muted)}.facts dd{font-size:1.3rem;margin-top:2px}
.chipw{background:linear-gradient(180deg,var(--mask),#0e1c18);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;box-shadow:0 30px 80px -40px rgba(0,0,0,.8)}
.chipw-in{display:grid;grid-template-columns:1fr;gap:18px}
.chipw.full .chipw-in{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
.chipw.full .ctl{grid-row:span 2}.chipw.full .verdict{grid-column:2;align-self:start}
.chipw figcaption{margin-top:14px;font-size:.82rem;color:var(--muted)}
.ctl{display:grid;gap:12px}
.ctl-row{display:grid;gap:6px}
.ctl-l{font-size:.8rem;color:var(--muted)}
.ctl-v{font-size:.85rem;color:var(--gold-hi)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:#0a1411;border:1px solid var(--line);border-radius:var(--r-s);padding:3px}
.seg button{flex:1 1 auto;padding:6px 10px;border-radius:4px;font-size:.84rem;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--paper)}
.seg button.on{background:var(--mask-2);color:var(--paper);box-shadow:inset 0 0 0 1px var(--gold)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--gold);height:28px}
.safety{display:flex;flex-wrap:wrap;gap:6px}
.pin{padding:6px 10px;border-radius:var(--r-s);border:1px solid var(--line);background:rgba(12,23,20,.7);font-size:.8rem;text-align:left}
.pin.ok{border-color:rgba(121,224,190,.4);color:#cdeee2}.pin.bad{border-color:rgba(255,138,112,.6);background:rgba(255,138,112,.1);color:#ffc2b3}
.die{border:1px solid var(--gold);border-radius:10px;background:#0a1411;padding:14px;box-shadow:inset 0 0 0 4px #0a1411,inset 0 0 0 5px rgba(227,176,75,.3)}
.gates{display:grid;grid-template-columns:repeat(17,1fr);gap:3px}
.gates span{aspect-ratio:1;border-radius:2px;background:#1e342e;transition:background .2s}
.gates span.hi{background:var(--gold);box-shadow:0 0 5px rgba(227,176,75,.45)}
.die-name{font-weight:600;font-size:.84rem;margin-top:10px}
.die-sub{font-size:.75rem;color:var(--muted)}
.verdict-word{font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.allow .verdict-word{color:var(--pass)}.deny .verdict-word{color:var(--deny)}
.verdict-sub{font-size:.9rem;color:#c9d8d1;margin:6px 0 12px}
@media (prefers-reduced-motion:reduce){.gates span{transition:none}}
.block{padding-top:44px;padding-bottom:20px}
.block>h2{margin-bottom:18px}
.note{margin-top:8px;padding:12px 16px;border:1px solid rgba(227,176,75,.4);border-radius:var(--r-m);background:rgba(227,176,75,.07)}
.err{padding:10px 14px;border:1px solid rgba(255,138,112,.45);border-radius:var(--r-s);background:rgba(255,138,112,.08);color:#ffc2b3;margin:12px 0;font-size:.92rem}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-l);padding:36px;text-align:center;margin-top:16px}.empty p{margin:0 auto 16px;color:#c9d8d1}
.vault{margin-top:16px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--mask);padding:22px 24px}
.vault-head{display:flex;align-items:center;gap:14px}
.vault-head>div{flex:1}.vault-head p{font-size:.92rem;margin-top:2px}
.vault-icon{color:var(--gold);display:flex;width:56px;height:40px;align-items:center;justify-content:center;border:1px solid var(--line-2);border-radius:var(--r-m)}
.status{font-size:.8rem;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--line-2)}
.status.live{color:var(--pass);border-color:rgba(121,224,190,.45)}.status.paused{color:var(--deny);border-color:rgba(255,138,112,.5)}.status.wait{color:var(--gold-hi);border-color:rgba(227,176,75,.45)}
.vault-stats{display:grid;grid-template-columns:repeat(4,1fr);margin:22px 0 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.vault-stats>div{padding:14px 0}.vault-stats>div+div{padding-left:18px;border-left:1px solid var(--line)}
.vault-stats dt{font-size:.8rem;color:var(--muted)}.vault-stats dd{font-size:1.35rem;margin-top:2px}
.meter{height:6px;border-radius:3px;background:#1e342e;overflow:hidden}.meter span{display:block;height:100%;background:var(--gold);border-radius:3px}
.meter-label{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:.88rem;color:var(--muted);max-width:none}
.meter-label span:last-child{color:var(--paper)}
details{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
summary{cursor:pointer;color:#c9d8d1;font-size:.93rem;font-weight:500}
summary::marker{color:var(--gold)}
.checks{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin:12px 0}
.checks li{font-size:.9rem;padding-left:24px;position:relative}
.checks li::before{content:"";position:absolute;left:0;top:.42em;width:12px;height:12px;border-radius:3px;border:1.5px solid currentColor}
.checks li.ok::before{background:var(--pass);border-color:var(--pass)}
.checks li.ok{color:#d7ece3}.checks li.bad{color:var(--deny)}
.chip-line{font-size:.9rem;color:#c9d8d1}.chip-line.ok b{color:var(--pass)}.chip-line.bad b{color:var(--deny)}.chip-line.wait b{color:var(--gold-hi)}
.hist{width:100%;border-collapse:collapse;margin-top:10px;font-size:.88rem}
.hist th{text-align:left;font-weight:500;color:var(--muted);padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.hist td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.fine{font-size:.8rem;color:var(--muted);margin-top:14px;max-width:none}
.feed{list-style:none;border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.feed li{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:12px;align-items:center;padding:12px 18px;font-size:.92rem;background:var(--mask)}
.feed li+li{border-top:1px solid var(--line)}
.flow{list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.flow li{counter-increment:s;padding:20px 18px;background:var(--mask);display:flex;flex-direction:column;gap:6px}
.flow li+li{border-left:1px solid var(--line)}
.flow li::before{content:counter(s);font-family:var(--mono);font-size:.8rem;color:var(--gold);width:26px;height:26px;border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.flow li:nth-child(3){background:var(--mask-2)}
.flow b{font-weight:600}.flow span{font-size:.9rem;color:#c9d8d1}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.split h2{margin-bottom:12px}.split p+p{margin-top:12px}.split p{color:#c9d8d1}
.plain{list-style:none;display:grid;gap:8px;color:#c9d8d1}
.plain li{padding-left:18px;position:relative}.plain li::before{content:"";position:absolute;left:0;top:.65em;width:8px;height:2px;background:var(--gold)}
.faq details{max-width:760px}.faq details p{margin-top:8px;color:#c9d8d1}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:28px;padding-bottom:40px;margin-top:48px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(4,10,8,.72);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:60;overflow:auto}
.sheet{width:100%;max-width:560px;background:var(--mask);border:1px solid var(--line-2);border-radius:var(--r-l);padding:24px;box-shadow:0 40px 100px -40px #000}
.sheet.small{max-width:440px}
.x{font-size:1.6rem;line-height:1;color:var(--muted);width:36px;height:36px;border-radius:var(--r-s)}.x:hover{color:var(--paper)}
.steps{list-style:none;display:flex;gap:6px;margin:16px 0 20px;flex-wrap:wrap;font-size:.8rem}
.steps li{padding:4px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.steps li.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}.steps li.done{color:var(--pass);border-color:rgba(121,224,190,.4)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.choice{text-align:left;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r-m);border:1px solid var(--line-2);background:#0e1c18;color:var(--muted);transition:border-color .15s}
.choice svg{color:var(--gold);margin-bottom:6px}.choice b{color:var(--paper);font-size:1.02rem}.choice span{font-size:.88rem}
.choice:hover{border-color:var(--gold)}.choice.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:#14261f}
.form{display:grid;gap:14px;margin-bottom:20px}
.form label,label.form{display:grid;gap:6px;font-size:.92rem;font-weight:500}
.form small,label.form small{font-weight:400;color:var(--muted);font-size:.82rem}
input,select{font:400 1rem var(--sans);color:var(--paper);background:#0a1411;border:1px solid var(--line-2);border-radius:var(--r-s);padding:11px 12px;width:100%}
input[type=number],#f-savings,#f-botAddr{font-family:var(--mono)}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
.chk{display:flex!important;align-items:center;gap:10px}.chk input{width:auto}
.summary{font-size:1.1rem;line-height:1.5;margin-bottom:14px}.summary b{color:var(--gold-hi);font-weight:600}
.terms{margin:0 0 22px 18px;display:grid;gap:6px;color:#c9d8d1;font-size:.92rem}
.dlg-text{color:#c9d8d1;margin:14px 0 18px}
@media (max-width:980px){
  .hero{grid-template-columns:1fr;gap:40px;padding-top:44px}
  .flow{grid-template-columns:1fr 1fr}.flow li+li{border-left:0}.flow li{border-top:1px solid var(--line)}
}
@media (max-width:680px){
  .wrap{padding-left:16px;padding-right:16px}.nav{display:none}.hdr-in{justify-content:space-between}
  .facts{grid-template-columns:1fr 1fr;gap:18px}
  .chip-panel{grid-template-columns:1fr;gap:18px;padding:16px}
  .pin::after,.die::after{display:none}
  .die{padding:0}.die-body{aspect-ratio:auto;flex-direction:row;padding:14px;gap:14px}.gates{width:120px;flex:none}
  .verdict{padding-left:0}
  .vault{padding:18px 16px}.vault-stats{grid-template-columns:1fr 1fr}.vault-stats>div:nth-child(3){padding-left:0;border-left:0}
  .vault-stats>div:nth-child(n+3){border-top:1px solid var(--line)}
  .checks,.split,.choices{grid-template-columns:1fr}.split{gap:28px}
  .flow{grid-template-columns:1fr}
  .feed li{grid-template-columns:1fr 1fr;row-gap:2px}
}
.nav a.on{color:var(--paper);box-shadow:inset 0 -2px 0 var(--gold);padding-bottom:4px}
.nav-m{display:none}
.acct{font-family:var(--mono);white-space:nowrap}
h1.pg{font-size:clamp(1.8rem,3.4vw,2.5rem);max-width:none;margin-bottom:12px}
.lead-s{color:#c9d8d1;margin-bottom:22px}
.narrow{max-width:820px}
h2.sub,h3.sub{margin:28px 0 12px}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.job{display:flex;flex-direction:column;gap:6px;text-align:left;padding:20px;border-radius:var(--r-l);border:1px solid var(--line-2);background:var(--mask);color:#c9d8d1;text-decoration:none;transition:border-color .15s}
.job b{color:var(--paper);font-size:1.15rem}.job-icon{color:var(--gold);margin-bottom:6px}
.job:hover{border-color:var(--gold);color:#c9d8d1}.job.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:var(--r-m);border:1px solid var(--line-2);background:#0e1c18;color:#c9d8d1;font-size:.9rem}
.mode b{color:var(--paper);font-size:1.02rem}.mode:hover{border-color:var(--gold)}.mode.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:#14261f}
.curve{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;height:64px;align-items:end;margin-top:8px}
.curve span{position:relative;height:100%;display:flex;align-items:flex-end;border-bottom:1px solid var(--line-2)}
.curve i{display:block;width:100%;background:var(--gold);border-radius:2px 2px 0 0;opacity:.85}
.curve em{position:absolute;top:0;left:0;right:0;text-align:center;font:500 .68rem var(--mono);color:var(--muted);font-style:normal}
.curve-x{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:4px}
.form.two{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}
.sees{margin:18px 0 14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:#0e1c18}
.sees-t{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.sees-l{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sees-l li{display:grid;gap:2px;font-size:.92rem}.sees-l span{font-size:.75rem;color:var(--muted)}
.kv{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin:12px 0}
.kv li{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;border-bottom:1px dotted var(--line);padding-bottom:4px}.kv span{color:var(--muted)}
.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;font-size:.86rem;min-width:640px;width:100%}
.grid th,.grid td{padding:8px;border:1px solid var(--line);text-align:center}
.grid thead th{color:var(--muted);font-weight:500;font-size:.78rem}
.grid tbody th{text-align:left;font-weight:600}
.grid td{font-family:var(--mono)}.grid td.k0{color:var(--muted)}.grid td.k1{background:rgba(227,176,75,.1)}.grid td.k2{background:rgba(227,176,75,.25)}.grid td.k3{background:rgba(227,176,75,.45);color:#fff}
.tag{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;justify-self:start}.tag.buy{color:var(--pass);border:1px solid rgba(121,224,190,.45)}.tag.sell{color:var(--gold-hi);border:1px solid rgba(227,176,75,.5)}
.feed li{grid-template-columns:auto 1fr 1fr auto auto}
.facts.wide{grid-template-columns:repeat(5,auto);margin:6px 0 10px}
.vault.classic{opacity:.92}
@media (max-width:980px){.chipw.full .chipw-in{grid-template-columns:1fr}.chipw.full .verdict{grid-column:auto}.facts.wide{grid-template-columns:repeat(3,auto)}}
@media (max-width:680px){
  .nav-m{display:flex;gap:4px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}.nav-m::-webkit-scrollbar{display:none}
  .nav-m a{flex:none;color:var(--muted);text-decoration:none;font-size:.88rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
  .nav-m a.on{color:var(--gold-ink);background:var(--gold);border-color:var(--gold)}
  .jobs,.modes,.form.two,.kv{grid-template-columns:1fr}.sees-l{grid-template-columns:1fr 1fr}
  .gates{grid-template-columns:repeat(17,1fr);gap:2px}
  .feed li{grid-template-columns:auto 1fr;row-gap:2px}.facts.wide{grid-template-columns:1fr 1fr}
  .vault-head{flex-wrap:wrap}.vault-head>div{flex-basis:100%;order:3}.vault-head .status{margin-left:auto}
  .hdr-in .acct{white-space:nowrap;font-size:.78rem;padding:0 9px}.hdr-in .btn.sm{padding:0 10px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>window.LATCH_CONFIG=__CONFIG__;</script>
<script>__APP__</script>
</body>
</html>
